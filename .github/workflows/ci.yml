name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # BUILD_NUMBER = commit count
      - name: Build dev image
        run: docker build -t ninja-turtle-dev -f docker/Dockerfile docker
      - name: Build + test in container
        run: docker run --rm -v "$PWD:/work" -w /work ninja-turtle-dev ./scripts/ci
